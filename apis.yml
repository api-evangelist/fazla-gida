aid: fazla-gida
name: Fazla Gida
description: >-
  Fazla (formerly Fazla Gida / Whole Surplus) is a Turkish technology-driven waste
  management and circular-economy company founded in 2017 in Istanbul. Its digital,
  decision-support platform helps B2B clients across the supply chain — manufacturers,
  retailers, e-commerce, distributors, HoReCa, food banks and municipalities — prevent
  waste at the source and recover value from surplus inventory through a food-recovery
  hierarchy of secondary-sales marketplace, donation, animal-feed conversion and recycling
  modules, backed by logistics support, a smart-scale IoT inventory system and an AI
  analysis tool that reports financial, CO2 and social impact. The company operates the
  Fazla Iyi surprise-box consumer app, is the first B Corp-certified waste-management
  organization in Turkey, and is backed by 500 Global among other investors.
